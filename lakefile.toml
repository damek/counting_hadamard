name = "RequestProject"
defaultTargets = ["RequestProject"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "RequestProject"
roots = ["RequestProject"]
globs = ["RequestProject.+"]

[[lean_lib]]
name = "PartialHadamard"
srcDir = "../.."
roots = ["PartialHadamard"]
globs = ["PartialHadamard"]
