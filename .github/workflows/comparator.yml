name: Comparator Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install landrun
        run: |
          go install github.com/zouuup/landrun/cmd/landrun@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Lean toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore Lake packages
        run: lake update

      - name: Build Lean project
        run: lake build

      - name: Build lean4export
        run: |
          git clone --depth 1 https://github.com/leanprover/lean4export.git /tmp/lean4export
          cd /tmp/lean4export
          lake build
          echo "/tmp/lean4export/.lake/build/bin" >> "$GITHUB_PATH"

      - name: Build comparator
        run: |
          git clone --depth 1 https://github.com/leanprover/comparator.git /tmp/comparator
          cd /tmp/comparator
          lake build

      - name: Run comparator
        run: |
          lake env /tmp/comparator/.lake/build/bin/comparator Comparator/comparator.json
